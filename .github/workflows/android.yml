name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支的新提交会取消上一次未完成的构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 签名密钥默认用仓库内的 signing/chargefloat.jks（debug key，公开无风险）。
      # 若配置了 Secrets，则优先用 Secrets 里的独立密钥，覆盖仓库内置的那份。
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/app/ci-signing.jks"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/app/ci-signing.jks" >> "$GITHUB_ENV"
            echo "已使用 Secrets 中的签名密钥"
          else
            echo "使用仓库内置签名密钥 signing/chargefloat.jks"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Read version
        id: ver
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "版本：v$VER ($CODE)"

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | head -5
          cp "$APK" "ChargeFloat-v${{ steps.ver.outputs.name }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChargeFloat-v${{ steps.ver.outputs.name }}
          path: ChargeFloat-v*.apk
          if-no-files-found: error
          retention-days: 30

      # 打 tag（如 v1.1）时自动创建 Release 并附上 APK
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ChargeFloat-v*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
